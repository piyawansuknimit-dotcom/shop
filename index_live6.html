<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F5EE"><meta name="color-scheme" content="light">
<title>ร้านพี่ฝน (ตัวอย่าง)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<style>
:root{--a:#0F8A5F;--bg:#F1F5EE;--ink:#1B2A24;--mut:#46544C;--bd:#D5DED3;--bd2:#C5D1C6;--sel:#DDF1E5;--gt:#CDEBD9;--gtx:#0B5A3A;--at:#FBE3AD;--atx:#6B3E00;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#E4EAE1;font-family:'Noto Sans Thai',system-ui,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}
#app{max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:500px){#app{height:min(900px,100dvh);margin-top:max(0px,calc((100dvh - 900px)/2));border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.12)}}
a,button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:14px}
.top{flex:none;padding:24px 20px 8px}
.top small{display:block;font-size:13px;color:var(--mut)}
h1{margin:0;font-size:24px;line-height:1.3;letter-spacing:-.01em;color:var(--a)}
h2{margin:0;font-size:17px}h3{margin:0;font-size:16px}
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:18px 20px 8px}
.bar h1{font-size:22px;color:var(--ink)}
.back{flex:none;width:44px;height:44px;border-radius:999px;background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:4px}
.sp{margin-left:auto}
.mut{color:var(--mut);font-size:13px;line-height:1.5}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--gt);color:var(--gtx);white-space:nowrap}
.tag.am{background:var(--at);color:var(--atx)}.tag.gr{background:#E3E7E2;color:#46544C}
.btn{min-height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--a);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.out{background:#fff;color:var(--ink);border:1px solid var(--bd2);font-weight:500;font-size:14px;min-height:44px;padding:0 16px}
.btn.sm{min-height:44px;font-size:14px;font-weight:500;padding:0 16px}
.btn[disabled]{background:#DDE3DD;color:#5B675F;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--a);border:1px solid var(--a);font-size:14px;font-weight:500;min-height:44px}
.btn.dash{background:#fff;border:1px dashed #A9B8AB;color:var(--mut);font-size:13px;font-weight:400;min-height:44px}
.foot{flex:none;padding:12px 20px 20px;background:#fff;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.price{font-weight:700;color:var(--a)}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--bd2);border-radius:14px;background:#fff;padding:0 14px;min-height:48px;font-size:15px}
textarea{padding:12px 14px;resize:none;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.opt{min-height:52px;display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:16px;border:2px solid var(--bd);background:#fff;text-align:left;width:100%;font-size:15px}
.opt.on{border-color:var(--a);background:var(--sel)}
.opt i{flex:none;width:20px;height:20px;border-radius:999px;border:2px solid var(--bd2);display:flex;align-items:center;justify-content:center}
.opt.on i{border-color:var(--a)}.opt.on i:after{content:'';width:8px;height:8px;border-radius:999px;background:var(--a)}
.two{display:flex;gap:10px}.two>*{flex:1}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--sel);color:var(--gtx);font-size:13px;line-height:1.5}
.note.am{background:var(--at);color:var(--atx)}
.sw{flex:none;width:56px;height:32px;border:0;border-radius:999px;padding:3px;display:flex;background:#B5C2B7}
.sw span{width:26px;height:26px;border-radius:999px;background:#fff}.sw.on{background:var(--a);justify-content:flex-end}
.step{display:flex;gap:14px}
.step .d{flex:none;width:28px;display:flex;flex-direction:column;align-items:center}
.step .c{width:28px;height:28px;border-radius:999px;border:3px solid var(--bd2);background:#fff;display:flex;align-items:center;justify-content:center}
.step.done .c{background:var(--a);border-color:var(--a)}.step.now .c{border-color:var(--a)}
.step .l{width:2px;flex:1;min-height:20px;background:var(--bd2)}.step.done .l{background:var(--a)}
.step .t{padding:3px 0 18px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:15px;color:var(--mut)}
.step.done .t,.step.now .t{color:var(--ink)}.step.now .t b{font-weight:700}
.qty{display:flex;align-items:center;border:1px solid var(--bd2);border-radius:999px;height:44px;background:#fff}
.qty button{width:44px;height:42px;border:0;background:transparent;font-size:22px}
.qty b{min-width:22px;text-align:center}
.pi{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:10px}
.pi.off{opacity:.55}
.th{flex:none;width:76px;height:76px;border-radius:14px;overflow:hidden}
#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#1B2A24;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center;z-index:9}
#toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.qrbox{background:#fff;padding:14px;border-radius:16px;border:1px solid var(--bd);display:inline-block}
.hero{margin:0 -20px;padding:26px 20px 18px;background:linear-gradient(135deg,#0F8A5F 0%,#0B6B49 100%);color:#fff;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:14px}
.ava{flex:none;width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:500}.chip.closed{background:#FBE3AD;color:#6B3E00;font-weight:700}
.how{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:12px 14px}
.how div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;line-height:1.35;color:var(--mut)}
.how b{width:24px;height:24px;border-radius:999px;background:var(--gt);color:var(--gtx);display:flex;align-items:center;justify-content:center;font-size:13px}.how i{flex:none;width:14px;height:2px;background:var(--bd2)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:#fff;border:1px solid var(--bd);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.pc.off{opacity:.7}
.pimg{position:relative;aspect-ratio:4/3;background:#eee}.pimg>svg,.pimg>img,.pimg>div{width:100%;height:100%}
.soldmask{position:absolute;inset:0;background:rgba(241,245,238,.7);display:flex;align-items:center;justify-content:center;font-weight:700;color:#46544C;font-size:15px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px}
.cartbar{flex:none;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(241,245,238,0))}
.badge{min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:#fff;color:var(--a);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
@media print{body{background:#fff}#app{box-shadow:none;border-radius:0;height:auto;max-width:none}.noprint{display:none!important}.scroll{overflow:visible}}

		for (var i = 0; i < length; i++) {

	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);

	while (offset < num.length && num[offset] === 0) {
		offset++;

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];

	get : function(index) {
		return this.num[index];

	getLength : function() {
		return this.num.length;

		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );

			return this;

		}

		return new QRPolynomial(num, 0).mod(e);
	}

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];

	}

	}

  products:loadProducts(), orders:loadOrders(), open:SHOP.api?true:store.get('open',true),
  cart:{}, f:{name:'',contact:'',tower:'A',when:'now',day:'วันนี้',time:'18:00',pay:'cash',note:'',lobbyTouched:false},
  loading:!!SHOP.api, loadErr:false, sending:false, pin:'',pinMsg:'',ord:[],ordLoaded:false,knownMax:0,tab:'new',busy:false,authed:false, reason:'', other:'', pinErr:false, padd:null, mine:store.get('mine',[])
};
function P(id){return S.products.filter(function(p){return p.id===id})[0]}
function O(id){return S.orders.filter(function(o){return o.id===+id})[0]}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function svg(d,sz,col,w){return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="'+col+'" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+d+'"></path></svg>'}
var BACK=svg('M15 5l-7 7 7 7',22,'#1B2A24');
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},2200)}
function out(p){return p.sold||p.stock<=0}
function cartLines(){return Object.keys(S.cart).filter(function(k){return S.cart[k]>0&&P(k)}).map(function(k){return {p:P(k),q:S.cart[k]}})}
function cartTotal(){return cartLines().reduce(function(a,l){return a+l.p.price*l.q},0)}
function cartCount(){return cartLines().reduce(function(a,l){return a+l.q},0)}
function orderTotal(o){return o.items.reduce(function(a,i){var p=P(i.pid);return a+(p?p.price*i.qty:0)},0)}
function orderText(o){return o.items.map(function(i){var p=P(i.pid);return (p?p.name:i.pid)+' × '+i.qty}).join(', ')}

var TH_D=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
function pad2(n){return (n<10?'0':'')+n}
function dayOpts(){var a=['วันนี้','พรุ่งนี้'],d=new Date();for(var i=2;i<5;i++){var x=new Date(d.getTime()+i*864e5);a.push(TH_D[x.getDay()]+' '+x.getDate())}return a}
function timeOpts(day){var a=[];for(var h=7;h<=21;h++){a.push(pad2(h)+':00');if(h<21)a.push(pad2(h)+':30')}
  if(day==='วันนี้'){var n=new Date(),m=n.getHours()*60+n.getMinutes()+20;a=a.filter(function(t){var q=t.split(':');return (+q[0])*60+(+q[1])>=m})}return a}
function clock(iso){var d=new Date(iso),n=new Date();if(isNaN(d))return '';var t=pad2(d.getHours())+':'+pad2(d.getMinutes());if(d.toDateString()!==n.toDateString())t=d.getDate()+'/'+(d.getMonth()+1)+' '+t;return t}
function ago(iso){var d=new Date(iso);if(isNaN(d))return '';var m=Math.floor((Date.now()-d.getTime())/60000);if(m<1)return 'เมื่อสักครู่';if(m<60)return m+' นาทีที่แล้ว';var h=Math.floor(m/60);if(h<24)return h+' ชม.ที่แล้ว';return Math.floor(h/24)+' วันที่แล้ว'}
function beep(){try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.18,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.start();o.stop(c.currentTime+.6)}catch(e){}}
function pendingCount(){return SHOP.api?S.ord.filter(function(o){return o.status==='รอยืนยัน'}).length:S.orders.filter(function(o){return o.status==='wait'}).length}
function payName(x){return x==='cash'?'เงินสด':'โอนพร้อมเพย์'}

function thumb(p){
  if(p.img)return '<img src="'+p.img+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">';
  var i=illus(p.id);
  if(i)return i;
  return '<div style="width:100%;height:100%;background:#CDEBD9;display:flex;align-items:center;justify-content:center">'+svg('M4 10l1.5-5h13L20 10M4 10v9h16v-9M4 10h16M9 19v-5h6v5',40,'#0B5A3A',1.6)+'</div>';
}

  return '🛒 ออเดอร์ใหม่ #'+o.id+' · '+SHOP.name+'\n'+o.items.map(function(i){var p=P(i.pid);return '• '+(p?p.name:i.pid)+' × '+i.qty}).join('\n')+

function qrSvg(text,px){
  try{var m=makeQR(text),n=m.length,q=4,sz=n+q*2,r='';
    for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(m[y][x])r+='<rect x="'+(x+q)+'" y="'+(y+q)+'" width="1" height="1"/>';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+sz+' '+sz+'" width="'+px+'" height="'+px+'" shape-rendering="crispEdges" role="img" aria-label="QR ร้าน"><rect width="'+sz+'" height="'+sz+'" fill="#fff"/><g fill="#000">'+r+'</g></svg>'}catch(e){return '<div class="mut">สร้าง QR ไม่ได้</div>'}
}

  '<label class="f"><span>ลิงก์ร้าน</span><input type="text" readonly value="'+esc(url)+'" onclick="this.select()"></label><button class="btn out noprint" data-act="copyLink">คัดลอกลิงก์</button><button class="btn noprint" data-act="print">พิมพ์ป้าย QR</button><div class="mut noprint">พิมพ์ติดหน้าห้อง ป้ายหน้าตึก หรือส่งภาพ QR ในกลุ่ม LINE</div></div>'+ownerNav('qr');

/* ====================== render / routing ====================== */
function render(){
  var r=S.route,a=S.arg,h='';
  try{
    if(r==='shop')h=vShop();else if(r==='checkout')h=cartCount()?vCheckout():vShop();else if(r==='status')h=vStatus(a);
    else if(['owner','products','qr','cancelS','add'].indexOf(r)>=0){
      if(!S.authed)h=vPin();else if(r==='owner')h=SHOP.api?vOwnerApi():vOwner();else if(r==='products')h=vProducts();else if(r==='qr')h=vQr();else if(r==='add')h=vAdd();else h=vCancelS(a);
    }else h=vShop();
  }catch(e){h='<div class="scroll"><div class="note am">เกิดข้อผิดพลาด: '+esc(e.message)+'</div><button class="btn" data-go="shop">กลับหน้าร้าน</button></div>';console.error(e)}
  var sy=0,sc=document.querySelector('#app .scroll');if(sc&&render.last===r)sy=sc.scrollTop;
  document.getElementById('app').innerHTML=h;
  sc=document.querySelector('#app .scroll');if(sc)sc.scrollTop=sy;render.last=r;
}
function go(r,a,keep){
  S.route=r;S.arg=a||null;S.reason='';S.other='';S.pinErr=false;render.last=null;
  if(!keep){var h='#/'+(r==='shop'?'':r)+(a?'/'+a:'');try{history.replaceState(null,'',h==='#/'?location.pathname+location.search:h)}catch(e){}}
  render();
}
function fromHash(){
  var h=location.hash.replace(/^#\/?/,'').split('/');var r=h[0]||'shop';
  if(['shop','owner','products','qr','status','checkout','cancelS','add'].indexOf(r)<0)r='shop';
  S.route=r;S.arg=h[1]||null;
}
function reloadShared(){if(!SHOP.api){S.products=loadProducts();S.open=store.get('open',true)}S.orders=loadOrders()}

function applyRemote(d){
  if(!d||!d.ok)return false;
  var sh=d.shop||{};
  SHOP.name=sh.name||SHOP.name;SHOP.owner=sh.owner||'';SHOP.tower=sh.tower||SHOP.tower;SHOP.line=sh.line||'';
  SHOP.pay={cash:!!sh.cash,transfer:!!sh.transfer};SHOP.promptpayNote=sh.promptpayNote||'';
  S.open=!!sh.open;S.products=(d.products||[]).map(function(p){p.sold=!!p.sold;return p});
  Object.keys(S.cart).forEach(function(k){if(!P(k))delete S.cart[k]});
  document.title=SHOP.name;return true;
}
function loadRemote(){
  if(!SHOP.api)return;
  S.errInfo='';
  fetch(SHOP.api+(SHOP.api.indexOf('?')<0?'?':'&')+'t='+Date.now()).then(function(r){S.httpStatus=r.status;return r.text()}).then(function(t){
    var d=null;try{d=JSON.parse(t)}catch(e){S.errInfo='เซิร์ฟเวอร์ตอบกลับมาไม่ใช่ข้อมูลเมนู (HTTP '+S.httpStatus+') มักเกิดจากตั้งสิทธิ์เว็บแอปไม่เป็น "ทุกคน" หรือ URL ผิด · เริ่มต้นข้อความ: '+t.slice(0,80).replace(/\s+/g,' ')}
    S.loading=false;if(d&&!d.ok)S.errInfo='หลังบ้านแจ้งว่า: '+(d.msg||'ไม่ทราบสาเหตุ');
    S.loadErr=!applyRemote(d);render();
  }).catch(function(e){S.loading=false;S.loadErr=true;S.errInfo='เชื่อมต่อไม่ได้: '+(e&&e.message||e)+' · ถ้าเปิดในพรีวิวของแอป Claude ให้ดาวน์โหลดไฟล์แล้วเปิดใน Chrome';render()});
}
function postApi(o){
  return fetch(SHOP.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(r){return r.json()});
}

function ownerCall(o){o.pin=S.pin;return postApi(o)}
function applyOrders(res){
  var prev=S.knownMax,mx=res.orders.reduce(function(m,o){return Math.max(m,o.id)},0);
  var fresh=S.ordLoaded?res.orders.filter(function(o){return o.id>prev&&o.status==='รอยืนยัน'}):[];
  S.ord=res.orders;if(res.menu)applyRemote(res.menu);S.knownMax=Math.max(prev,mx);S.ordLoaded=true;
  var pend=pendingCount();document.title=(pend?'('+pend+') ':'')+SHOP.name+(pend?' · มีออเดอร์รอยืนยัน':'');
  if(fresh.length){beep();toast('ออเดอร์ใหม่ '+fresh.length+' รายการ · '+fresh[0].name);S.tab='new'}
}
function pollOwner(){
  if(!SHOP.api||!S.authed||!S.pin)return;
  ownerCall({action:'ownerOrders'}).then(function(r){
    if(!r||!r.ok)return;var b=JSON.stringify(S.ord);applyOrders(r);
    if(JSON.stringify(S.ord)!==b){var a=document.activeElement;if(!a||['INPUT','TEXTAREA','SELECT'].indexOf(a.tagName)<0)render()}
  }).catch(function(){});
}
function ownerOp(id,op,okMsg,extra,backToList){
  if(S.busy)return;S.busy=true;var body={action:'ownerSetStatus',id:+id,op:op};if(extra)for(var k in extra)body[k]=extra[k];
  ownerCall(body).then(function(res){S.busy=false;if(!res.ok){toast(res.msg||'ไม่สำเร็จ');pollOwner();return}applyOrders(res);if(backToList)go('owner');else render();toast(okMsg)}).catch(function(){S.busy=false;toast('ไม่สำเร็จ ลองใหม่อีกครั้ง')});
}
var ACT={
  tab:function(v){S.tab=v;render()},
  refreshOrders:function(){pollOwner();toast('รีเฟรชแล้ว')},
  saveP:function(v){
    var p=Object.assign({},P(v));document.querySelectorAll('[data-pf="'+v+'"]').forEach(function(el){var k=el.getAttribute('data-k');p[k]=(k==='price'||k==='stock')?Math.max(0,Math.floor(+el.value)||0):el.value});

  },

    var d=S.padd||{};d.price=Math.floor(+d.price)||0;d.stock=Math.max(0,Math.floor(+d.stock)||0);d.unit=d.unit||'ชิ้น';
    if(!String(d.name||'').trim()){toast('ใส่ชื่อสินค้าก่อน');return}if(d.price<1){toast('ใส่ราคาก่อน');return}
    if(!SHOP.api){var id='p'+Date.now().toString(36);S.products.push({id:id,name:d.name.trim(),price:d.price,unit:d.unit,stock:d.stock,sold:false,desc:d.desc||'',allergen:d.allergen||'',img:d.img||''});saveProducts();S.padd=null;go('products');toast('เพิ่มสินค้าแล้ว');return}

  },

  inc:function(v){var p=P(v);var q=(S.cart[v]||0)+1;if(q>p.stock){toast('เหลือแค่ '+p.stock+' '+p.unit);return}S.cart[v]=q;render()},

    if(!S.open){toast('ร้านปิดรับออเดอร์อยู่');return}

    if(SHOP.api){
      if(S.sending)return;S.sending=true;toast('กำลังส่งออเดอร์...');
      var body={name:f.name.trim(),contact:f.contact.trim(),tower:f.tower,lobby:f.lobby||f.tower,whenText:f.when==='now'?'ทันที':f.day+' '+f.time,pay:f.pay,note:f.note.trim(),items:lines.map(function(l){return {pid:l.p.id,qty:l.q}})};

  toggleOpen:function(){if(SHOP.api){ownerCall({action:'ownerSetOpen',open:!S.open}).then(function(res){if(res.ok){applyRemote(res.menu);render();toast(S.open?'เปิดรับออเดอร์แล้ว':'ปิดรับออเดอร์แล้ว')}else toast(res.msg||'ไม่สำเร็จ')}).catch(function(){toast('ไม่สำเร็จ ลองใหม่')});return}S.open=!S.open;store.set('open',S.open);render()},
  sConfirm:function(v){if(SHOP.api)return ownerOp(v,'confirm','ยืนยันออเดอร์แล้ว');reloadShared();O(v).status='confirmed';saveOrders();render();toast('ยืนยันออเดอร์แล้ว')},
  sPaid:function(v){if(SHOP.api)return ownerOp(v,'paid','บันทึกว่ารับเงินแล้ว');reloadShared();O(v).status='done';saveOrders();render();toast('บันทึกว่ารับเงินแล้ว')},
  reason:function(v){S.reason=v;render()},
  cancelSeller:function(v){
    if(SHOP.api){var r0=S.reason,all0=BR.concat(SR),lab0=(all0.filter(function(x){return x[0]===r0})[0]||[0,''])[1];if(r0==='other'&&S.other.trim())lab0=S.other.trim();
      return ownerOp(v,r0==='noshow'?'noshow':(r0==='refuse'?'refuse':'cancel'),'ยกเลิกออเดอร์แล้ว',{reason:lab0,markSoldOut:r0==='soldout'},true)}
    reloadShared();var o=O(v),r=S.reason,all=BR.concat(SR),lab=(all.filter(function(x){return x[0]===r})[0]||[0,''])[1];
    if(r==='other'&&S.other.trim())lab=S.other.trim();
    o.status='cancelled';o.reason=lab;if(r==='noshow')o.noshow=true;if(r==='refuse')o.refused=true;
    o.items.forEach(function(i){var p=P(i.pid);if(p){p.stock+=i.qty;if(r==='soldout')p.sold=true}});
    saveProducts();saveOrders();go('owner');toast('ยกเลิกออเดอร์แล้ว');
  },
  toggleSold:function(v){var p=P(v);p.sold=!p.sold;saveProducts();render();toast(p.sold?'ปิดรับออเดอร์สินค้านี้แล้ว':'เปิดขายอีกครั้งแล้ว')},
  copyLink:function(){var u=shopUrl();if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){toast('คัดลอกลิงก์แล้ว')},function(){toast('คัดลอกไม่ได้ ลองกดค้างที่ช่องลิงก์')});else toast('กดค้างที่ช่องลิงก์เพื่อคัดลอก')},
  reloadMenu:function(){S.loading=true;S.loadErr=false;render();loadRemote()},
  copyOrder:function(v){var t=msgOf(O(v));if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('คัดลอกแล้ว ไปวางในแชทผู้ขายได้เลย')},function(){toast('คัดลอกไม่ได้')});else toast('คัดลอกไม่ได้')},
  print:function(){window.print()}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-go]');if(!el)return;
  if(el.hasAttribute('data-act')){var f=ACT[el.getAttribute('data-act')];if(f)f(el.getAttribute('data-v'));return}
  var g=el.getAttribute('data-go').split(':');go(g[0],g[1]||null);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='name')S.f.name=t.value;else if(t.id==='contact')S.f.contact=t.value;else if(t.id==='note')S.f.note=t.value;else if(t.id==='other')S.other=t.value;
  else if(t.hasAttribute('data-pa')){S.padd=S.padd||{unit:'ชิ้น'};S.padd[t.getAttribute('data-pa')]=t.value}
  else if(t.hasAttribute('data-p')){var p=P(t.getAttribute('data-p')),k=t.getAttribute('data-k'),n=Math.max(0,Math.floor(+t.value)||0);if(k==='price'&&n<1)return;p[k]=n;saveProducts()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-pa')){S.padd=S.padd||{unit:'ชิ้น'};S.padd[t.getAttribute('data-pa')]=t.value;return}
  if(t.id==='mytower'){S.f.tower=t.value;if(!S.f.lobbyTouched)S.f.lobby=t.value;render()}
  else if(t.id==='lobby'){S.f.lobby=t.value;S.f.lobbyTouched=true}else if(t.id==='day'){S.f.day=t.value;render()}else if(t.id==='time')S.f.time=t.value;
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='pin')ACT.login()});
window.addEventListener('hashchange',function(){fromHash();render()});
window.addEventListener('storage',function(){reloadShared();var a=document.activeElement;if(!a||['INPUT','TEXTAREA','SELECT'].indexOf(a.tagName)<0)render()});
setInterval(function(){var a=document.activeElement;if(a&&['INPUT','TEXTAREA','SELECT'].indexOf(a.tagName)>=0)return;if(S.route==='status'||S.route==='owner'){var b=JSON.stringify(S.orders);reloadShared();if(JSON.stringify(S.orders)!==b)render()}},2000);
fromHash();render();loadRemote();
setInterval(function(){if(document.hidden)return;pollMine();pollOwner()},8000);
(function(){if(!SHOP.api)return;var sp='';try{sp=sessionStorage.getItem('tlb_pin_'+SHOP.api)||''}catch(e){}
  if(sp){S.pin=sp;ownerCall({action:'ownerLogin'}).then(function(res){if(res.ok){S.authed=true;applyOrders(res);render()}}).catch(function(){})}})();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&SHOP.api&&S.route==='shop'&&!S.loading){var a=document.activeElement;if(!a||['INPUT','TEXTAREA','SELECT'].indexOf(a.tagName)<0)loadRemote()}});
</script>
</body>
</html>
